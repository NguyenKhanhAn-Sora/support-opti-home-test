name: Daily OptiBot Sync
 
on:
  schedule:
    - cron: "0 2 * * *" 
  workflow_dispatch: {}
 
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@v4
 
      - name: Build Docker image
        run: docker build -t optibot-job .
 
      - name: Run Job
        run: >
          docker run --rm
          -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          -e FILE_SEARCH_STORE=${{ secrets.FILE_SEARCH_STORE }}
          optibot-job